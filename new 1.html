<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#32223a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bayt Al Ma'wā">
<meta name="description" content="Bayt Al Ma'wā (بيت المأوى) Hifdh Online School & LMS platform.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bayt Al Ma'wā · بيت المأوى Hifdh Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#26182c; --bg2:#32223a; --surface:#3d2b45; --surface2:#4a3554; --line:#5b4366;
  --fg:#f3ecef; --muted:#c4b2cc; --faint:#937d9e;
  --accent:#e6c387; --accent-ink:#26182c; --accent-soft:rgba(230,195,135,.15);
  --c0:#bf8a80; --c1:#cc9f7b; --c2:#d8c087; --c3:#b6c198; --c4:#8fa486; --c5:#5a7660;
  --chip-ink:#201424; --good:#9fbf8f; --warn:#d8a66a;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Amiri","Traditional Arabic","Geeza Pro","Noto Naskh Arabic",serif;
  --r:16px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f4f6; --bg2:#efe8ed; --surface:#ffffff; --surface2:#f3ecf1; --line:#e0d2d9;
    --fg:#2c1b33; --muted:#6c5875; --faint:#9b86a6;
    --accent:#8c6920; --accent-ink:#ffffff; --accent-soft:rgba(140,105,32,.12);
    --c0:#a85a52; --c1:#b87d4e; --c2:#9a7b2c; --c3:#5e8a52; --c4:#4f7a63; --c5:#3d5a45;
    --chip-ink:#ffffff; --good:#3f7a3a; --warn:#a2621d;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f7f4f6; --bg2:#efe8ed; --surface:#ffffff; --surface2:#f3ecf1; --line:#e0d2d9;
  --fg:#2c1b33; --muted:#6c5875; --faint:#9b86a6;
  --accent:#8c6920; --accent-ink:#ffffff; --accent-soft:rgba(140,105,32,.12);
  --c0:#a85a52; --c1:#b87d4e; --c2:#9a7b2c; --c3:#5e8a52; --c4:#4f7a63; --c5:#3d5a45;
  --chip-ink:#ffffff; --good:#3f7a3a; --warn:#a2621d;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#26182c; --bg2:#32223a; --surface:#3d2b45; --surface2:#4a3554; --line:#5b4366;
  --fg:#f3ecef; --muted:#c4b2cc; --faint:#937d9e;
  --accent:#e6c387; --accent-ink:#26182c; --accent-soft:rgba(230,195,135,.15);
  --c0:#bf8a80; --c1:#cc9f7b; --c2:#d8c087; --c3:#b6c198; --c4:#8fa486; --c5:#5a7660;
  --chip-ink:#201424; --good:#9fbf8f; --warn:#d8a66a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 100% 0%,var(--accent-soft),transparent 60%),var(--bg);min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-ar);font-size:22px;color:var(--accent);line-height:1.2}
.brand span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.who-group{display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;max-width:45vw;min-width:0}
.who i{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;flex:none}
.who em{font-style:normal;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);flex:none}
.theme-btn svg{width:18px;height:18px}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:20px;display:flex;flex-direction:column;gap:28px}

h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0}
h1{font-size:36px}
h2{font-size:26px}
h3{font-size:20px}
p{margin:0}
.lede{color:var(--muted);max-width:60ch}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ar{font-family:var(--f-ar);direction:rtl;font-size:22px;line-height:1.8;color:var(--accent);text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:0}

.btn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:9px 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--c0);border-color:color-mix(in srgb,var(--c0) 50%,var(--line))}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],textarea,select{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}

.tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.tick svg{width:15px;height:15px;opacity:0}
.tick.on{background:var(--c3);border-color:var(--c3);color:var(--chip-ink)}
.tick.on svg{opacity:1}

.task{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:16px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:4px}
.task .k{grid-column:2}
.task .t{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.2}
.task .d{color:var(--muted);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}

.juzgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.juz{aspect-ratio:1/1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:16px;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.juz.sel{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}

.channel-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lrn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lrn:first-child{border-top:0}
.lrn .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.lrn .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--faint);text-decoration:none;font-size:10px}
nav.tabs a svg{width:20px;height:20px}
nav.tabs a[aria-current="page"]{color:var(--fg)}
nav.tabs a[aria-current="page"] svg{color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet .s{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:680px;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#sheet .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s;opacity:0;pointer-events:none}
#toast.show{opacity:1}

#loginScreen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px}
#loginScreen .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
</style>
</head><body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="card">
    <div style="text-align:center; display:flex; flex-direction:column; gap:4px;">
      <div class="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div style="font-family:var(--f-display); font-size:26px; color:var(--accent); font-weight:600;">بيت المأوى</div>
      <span class="eyebrow">Bayt Al Ma'wā · Hifdh Online School</span>
    </div>
    
    <div id="quoteBox" style="background:var(--bg2); border-radius:12px; padding:14px; border:1px solid var(--line); text-align:center; display:flex; flex-direction:column; gap:6px;">
      <div id="quoteAr" class="ar" style="font-size:19px;"></div>
      <div id="quoteEn" style="font-style:italic; font-size:13.5px; color:var(--muted);"></div>
      <div id="quoteSrc" style="font-size:11px; color:var(--accent); letter-spacing:.08em; text-transform:uppercase;"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <label class="f">Email Address<input type="email" id="loginEmail" placeholder="yourname@baytalmawa.org"></label>
      <label class="f">Password<input type="password" id="loginPass" placeholder="••••••••"></label>
      <button class="btn accent" id="loginBtn" style="justify-content:center; padding-block:12px;">Sign In to Dashboard</button>
    </div>
  </div>
</div>

<header class="top"><div class="wrap">
  <div class="brand"><b lang="ar">بيت المأوى</b><span>Bayt Al Ma'wā Hifdh</span></div>
  <div class="who-group">
    <button class="theme-btn" data-act="toggleTheme" aria-label="Toggle Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    </button>
    <button class="who" data-act="logout" id="whoBtn" aria-label="Sign out"><i>·</i><em>Sign out</em></button>
  </div>
</div></header>
<main><div class="wrap" id="view"><p class="muted">Loading…</p></div></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

const MASTER_ADMIN = "somaiya2004nahin@gmail.com";

const QUOTES = [
  {ar:"وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ",en:"And We have certainly made the Qur’an easy to remember, so is there any who will remember?",src:"Surah Al-Qamar"},
  {ar:"أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ",en:"The most beloved deeds to Allah are those that are consistent, even if they are small.",src:"Sahih Al-Bukhari"},
  {ar:"يُقَالُ لِصَاحِبِ الْقُرْآنِ: اقْرَأْ وَارْتَقِ وَرَتِّلْ",en:"It will be said to the companion of the Qur’an: Recite and rise in status, recite as you used to recite in the world.",src:"Sunan Abu Dawud"},
  {ar:"وَقُل رَّبِّ زِدْنِي عِلْمًا",en:"And say, 'My Lord, increase me in knowledge.'",src:"Surah Taha"}
];

function loadRandomQuote(){
  const q = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteAr').textContent = q.ar;
  document.getElementById('quoteEn').textContent = `"${q.en}"`;
  document.getElementById('quoteSrc').textContent = `— ${q.src}`;
}

const COND=['Completely forgotten','Very weak','Weak','Average','Strong','Very strong'];
const LS='bayt_almawa.v7_auth';

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

let S={
  currentUserEmail:null,
  theme:'system', // 'system', 'light', 'dark'
  users:{},
  learners:{},
  channels:[
    {id:'c1',name:'Main 24-Month Hifdh Intake',desc:'Primary 6-hour daily Hifdh cohort'},
    {id:'c2',name:'Advanced Tajweed & Phonetics',desc:'Specialized weekend sessions'}
  ]
};
const ui={view:'today'};
let ready=false;

function applyTheme(){
  const t = S.theme || 'system';
  if(t==='system'){
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', t);
  }
}

function newLearner(name,email,channelId){
  return {id:uid(),name:name.trim()||'Student',email:email||'',channelId:channelId||'c1',created:today(),juz:{},hist:[],lessons:{},log:{}}
}
function isMaker(){return S.currentUserEmail && S.currentUserEmail.toLowerCase()===MASTER_ADMIN}
function currentUser(){return S.currentUserEmail ? S.users[S.currentUserEmail] : null}
function L(){
  const user = currentUser();
  if(!user) return null;
  if(isMaker()){
    let activeId = S.activeStudentId || Object.keys(S.learners)[0];
    return S.learners[activeId] || Object.values(S.learners)[0] || null;
  }
  let rec = Object.values(S.learners).find(x=>x.email===user.email);
  if(!rec){
    rec = newLearner(user.name, user.email, 'c1');
    S.learners[rec.id]=rec;
    flush();
  }
  return rec;
}
function entry(Lr,d){return Lr.log[d]||(Lr.log[d]={})}
function peek(Lr,d){return Lr.log[d]||null}

function flush(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function boot(){
  try{
    const raw=localStorage.getItem(LS);
    if(raw){S=JSON.parse(raw);}
    else{
      S.users[MASTER_ADMIN]={name:'Somaiya (Head Teacher)',email:MASTER_ADMIN,pass:'admin123',role:'teacher'};
      const ex=newLearner('Maryam (Student)','maryam@baytalmawa.org','c1');
      S.users['maryam@baytalmawa.org']={name:'Maryam',email:'maryam@baytalmawa.org',pass:'student123',role:'student'};
      S.learners[ex.id]=ex;
      S.currentUserEmail=null;
      flush();
    }
  }catch(e){}
  applyTheme();
  ready=true;route();
  loadRandomQuote();
  
  if(!S.currentUserEmail){
    document.getElementById('loginScreen').hidden = false;
  } else {
    document.getElementById('loginScreen').hidden = true;
  }
}

const IC={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2"/></svg>',
 cycle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19.5 12a7.5 7.5 0 0 1-12.8 5.3M4.5 12a7.5 7.5 0 0 1 12.8-5.3"/></svg>',
 lms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>',
 learners:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.6-3.3 3-5 6-5s5.4 1.7 6 5"/></svg>',
 maker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83"/></svg>',
 check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3.5 8.5l3 3 6-7"/></svg>'
};
const tick=(on,act,extra='')=>`<button class="tick${on?' on':''}" data-act="${act}" ${extra} aria-pressed="${on}">${IC.check}</button>`;

const VIEWS=['today','cycle','lms','learners','maker'];
const VNAME={today:'Today',cycle:'Juz',lms:'Courses',learners:'Roster',maker:'Maker Studio'};
function route(){const h=location.hash.slice(1);ui.view=VIEWS.includes(h)?h:'today';render()}
window.addEventListener('hashchange',route);
function go(v){if(location.hash.slice(1)===v)render();else location.hash=v;window.scrollTo(0,0)}

function render(){
 const user=currentUser();
 if(!user) return;
 const who=document.getElementById('whoBtn');
 who.querySelector('i').textContent = user.name.charAt(0).toUpperCase();
 who.querySelector('em').textContent = isMaker()?'Head Teacher':user.name;
 
 document.getElementById('tabs').innerHTML=VIEWS.map(v=>{
   if(v==='maker' && !isMaker()) return '';
   return `<a href="#${v}" ${ui.view===v?'aria-current="page"':''}>${IC[v]}<span>${VNAME[v]}</span></a>`;
 }).join('');

 const el=document.getElementById('view');
 if(!ready){el.innerHTML='<p class="muted">Loading…</p>';return}
 el.innerHTML=({today:vToday,cycle:vCycle,lms:vLms,learners:vLearners,maker:vMaker})[ui.view]();
}

function vToday(){
 const Lr=L(),t=today(),e=peek(Lr,t)||{};
 const channel = S.channels.find(c=>c.id===Lr.channelId) || S.channels[0];
 return`<section class="sec">
  <p class="eyebrow" lang="ar">بيت المأوى · Bayt Al Ma'wā Online School</p>
  <h1>${isMaker()?esc(Lr.name)+'’s Daily Tracker':'My Daily Hifdh'}</h1>
  <div class="row"><span class="badge good">Channel: ${esc(channel.name)}</span></div>
 </section>
 <section class="panel">
  <div class="task">${tick(!!e.done,'toggleToday')}<div class="k"><div class="t">Daily 6-Hour Session & Lessons</div><div class="d">Complete teacher review, new memorisation, and Tajweed practice.</div></div></div>
 </section>
 <section class="sec">
  <div class="sec-h"><h2>Daily Reflections & Notes</h2></div>
  <textarea id="note" placeholder="Note down teacher corrections or verses to repeat...">${esc(e.note||'')}</textarea>
 </section>`;
}

function vCycle(){
 const Lr=L();
 const grid=Array.from({length:30},(_,k)=>{const j=k+1,c=Lr.juz[j];return`<button class="juz${c!=null?' sel':''}" data-act="pickJuz" data-j="${j}">${j}</button>`}).join('');
 return`<section class="sec"><p class="eyebrow">Revision Tracker</p><h1>Juz Memorisation Map</h1><p class="lede">Tap any Juz to record your retention status.</p></section>
 <section class="panel"><div class="juzgrid">${grid}</div></section>`;
}
function juzSheet(j){
 const Lr=L(),c=Lr.juz[j];
 const html=`<div class="spread"><h3>Juz ${j}</h3><button class="btn ghost" data-act="closeSheet">Close</button></div>
 ${COND.map((n,i)=>`<button class="opt" data-act="setCond" data-j="${j}" data-c="${i}">${n}</button>`).join('')}
 <button class="opt" data-act="setCond" data-j="${j}" data-c="">Not memorised yet</button>`;
 const s=document.getElementById('sheet');s.innerHTML='<div class="s">'+html+'</div>';s.hidden=false;
}

function vLms(){
 const Lr=L();
 return `<section class="sec"><p class="eyebrow">LMS Channels</p><h1>Course Tracks & Channels</h1><p class="lede">Access your enrolled study circles and specialized subject channels.</p></section>
 <section class="panel" style="gap:16px">
   ${S.channels.map(c=>`
     <div class="channel-card">
       <div class="spread"><h3>${esc(c.name)}</h3>${Lr.channelId===c.id?'<span class="badge good">Enrolled</span>':`<button class="btn primary" data-act="joinChannel" data-id="${c.id}">Join Channel</button>`}</div>
       <p class="small muted">${esc(c.desc)}</p>
     </div>
   `).join('')}
 </section>`;
}

function vLearners(){
 if(!isMaker()) return '<p class="muted">Restricted access.</p>';
 const list=Object.values(S.users);
 return`<section class="sec"><p class="eyebrow">Head Teacher Portal</p><h1>Registered Members Roster</h1></section>
 <section class="panel">
   ${list.map(u=>`
     <div class="lrn">
       <span class="av">${esc(u.name.charAt(0))}</span>
       <div class="nm">${esc(u.name)} <span class="badge">${u.role}</span><br><span class="muted small">${u.email} · Password: <code>${u.pass}</code></span></div>
       <div class="row">
         <button class="btn ghost" data-act="resetUserPass" data-email="${u.email}">Reset Password</button>
       </div>
     </div>
   `).join('')}
 </section>`;
}

function vMaker(){
 if(!isMaker()) return '<p class="muted">Restricted.</p>';
 const curTheme = S.theme || 'system';
 return `<section class="sec"><p class="eyebrow">Maker Studio</p><h1>Head Teacher Control Panel</h1><p class="lede">Manage users, LMS channels, and appearance settings.</p></section>
 
 <section class="panel">
   <h3>Appearance Theme</h3>
   <label class="f">Color Mode
     <select id="themeSelect">
       <option value="system" ${curTheme==='system'?'selected':''}>Match System Setting</option>
       <option value="dark" ${curTheme==='dark'?'selected':''}>Dark Mode</option>
       <option value="light" ${curTheme==='light'?'selected':''}>Light Mode</option>
     </select>
   </label>
   <button class="btn accent" data-act="saveTheme">Apply Theme</button>
 </section>

 <section class="panel">
   <h3>Add New Student or Teacher</h3>
   <label class="f">Full Name<input type="text" id="newName" placeholder="Sister Fatima"></label>
   <label class="f">Email Address<input type="email" id="newEmail" placeholder="fatima@baytalmawa.org"></label>
   <label class="f">Assigned Temporary Password<input type="text" id="newPass" value="hifdh2026"></label>
   <label class="f">Role
     <select id="newRole">
       <option value="student">Student</option>
       <option value="teacher">Teacher</option>
     </select>
   </label>
   <button class="btn accent" data-act="addUser">Register User & Generate Account</button>
 </section>

 <section class="panel">
   <h3>Change My Password</h3>
   <label class="f">New Password<input type="password" id="newAdminPass" placeholder="Enter new password"></label>
   <button class="btn accent" data-act="updatePass">Update Password</button>
 </section>

 <section class="panel">
   <h3>Create New LMS Course Channel</h3>
   <label class="f">Channel Name<input type="text" id="newChanName" placeholder="e.g., Fiqh & Aqeedah Track"></label>
   <label class="f">Description<input type="text" id="newChanDesc" placeholder="Weekly interactive sessions"></label>
   <button class="btn accent" data-act="addChannel">Add Channel</button>
 </section>`;
}

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,Lr=L(),t=today();
 switch(a){
  case 'toggleTheme':{
    const cur = S.theme || 'system';
    const next = cur==='system' ? 'dark' : cur==='dark' ? 'light' : 'system';
    S.theme = next;
    flush();applyTheme();
    toast('Theme: '+next);
    break;
  }
  case 'saveTheme':{
    const sel = document.getElementById('themeSelect').value;
    S.theme = sel;
    flush();applyTheme();
    toast('Theme updated successfully!');
    break;
  }
  case 'logout':
    S.currentUserEmail=null;flush();
    loadRandomQuote();
    document.getElementById('loginScreen').hidden=false;
    toast('Signed out');return;
  case 'toggleToday':{const e=entry(Lr,t);e.done=!e.done;flush();break}
  case 'pickJuz':juzSheet(+b.dataset.j);return;
  case 'setCond':{const c=b.dataset.c===''?null:+b.dataset.c;if(c===null)delete Lr.juz[+b.dataset.j];else Lr.juz[+b.dataset.j]=c;flush();document.getElementById('sheet').hidden=true;break}
  case 'closeSheet':document.getElementById('sheet').hidden=true;return;
  case 'joinChannel':{Lr.channelId=b.dataset.id;flush();toast('Joined channel');break}
  case 'updatePass':{
    const p=document.getElementById('newAdminPass').value.trim();
    if(!p){toast('Enter a password');return;}
    currentUser().pass=p;flush();toast('Password updated successfully!');break;
  }
  case 'resetUserPass':{
    const em=b.dataset.email;
    const newP=prompt('Enter new password for '+em+':');
    if(newP){S.users[em].pass=newP;flush();toast('Password reset for '+em);render();}
    break;
  }
  case 'addUser':{
    const name=(document.getElementById('newName').value||'').trim();
    const email=(document.getElementById('newEmail').value||'').trim().toLowerCase();
    const pass=(document.getElementById('newPass').value||'').trim();
    const role=document.getElementById('newRole').value;
    if(!name||!email||!pass){toast('Please fill all fields');return;}
    if(S.users[email]){toast('User with this email already exists.');return;}
    
    S.users[email]={name,email,pass,role};
    if(role==='student'){
      const rec=newLearner(name,email,'c1');
      S.learners[rec.id]=rec;
    }
    flush();toast('User successfully added!');render();break;
  }
  case 'addChannel':{
    const name=document.getElementById('newChanName').value.trim();
    const desc=document.getElementById('newChanDesc').value.trim();
    if(!name){toast('Enter channel name');return;}
    S.channels.push({id:uid(),name,desc});
    flush();toast('Channel created');break;
  }
 }
 render();
});

document.getElementById('loginBtn').addEventListener('click',()=>{
  const email=(document.getElementById('loginEmail').value||'').trim().toLowerCase();
  const pass=(document.getElementById('loginPass').value||'').trim();
  if(!S.users[email] || S.users[email].pass!==pass){
    toast('Invalid email or password');return;
  }
  S.currentUserEmail=email;
  flush();
  document.getElementById('loginScreen').hidden=true;
  render();
  toast('Welcome back, '+S.users[email].name);
});

document.addEventListener('input',e=>{
  if(e.target.id==='note'){const Lr=L();if(!Lr)return;entry(Lr,today()).note=e.target.value;flush()}
});

boot();
})();
</script>
</body></html>
